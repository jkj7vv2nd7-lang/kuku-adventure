<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4db2ff">
<title>九九アドベンチャー｜ククと九九の島</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🐲</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --sky1:#8ed8ff;--sky2:#d8f4ff;--grass:#7ed957;--ink:#23405c;--card:#ffffff;
  --accent:#ff9f1c;--accent2:#ff5d8f;--good:#2ec4b6;--bad:#ef476f;--gold:#ffd60a;
  --radius:22px;--shadow:0 6px 0 rgba(35,64,92,.18);
}
html,body{height:100%}
body{
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,#c9f2c0);
  min-height:100dvh;overflow-x:hidden;user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.view{display:none;max-width:560px;margin:0 auto;padding:14px 14px 40px;min-height:100dvh;flex-direction:column}
.view.active{display:flex}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:110px;height:34px;top:6%;animation-duration:65s}
.cloud.c1::before{width:48px;height:48px;top:-24px;left:16px}.cloud.c1::after{width:34px;height:34px;top:-16px;left:58px}
.cloud.c2{width:80px;height:26px;top:16%;animation-duration:90s;animation-delay:-40s}
.cloud.c2::before{width:36px;height:36px;top:-18px;left:12px}.cloud.c2::after{width:26px;height:26px;top:-12px;left:44px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.topbar{position:relative;z-index:2;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chip{background:var(--card);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(35,64,92,.15);display:inline-flex;align-items:center;gap:5px}
.chip.gold{background:#fff3b0}
.topbar .spacer{flex:1}
.iconbtn{background:var(--card);border-radius:50%;width:42px;height:42px;font-size:20px;box-shadow:0 3px 0 rgba(35,64,92,.15);display:inline-flex;align-items:center;justify-content:center}
h1.title{text-align:center;font-size:clamp(28px,8vw,40px);font-weight:900;letter-spacing:.02em;color:#fff;text-shadow:0 3px 0 #2b7cd3,0 6px 14px rgba(35,64,92,.25);position:relative;z-index:2}
h1.title .sub{display:block;font-size:clamp(13px,3.6vw,17px);color:#eaf7ff;text-shadow:0 2px 0 #2b7cd3;margin-top:2px}
.charzone{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;margin-top:2px}
.bubble{position:relative;background:#fff;border-radius:18px;padding:10px 16px;font-weight:800;font-size:16px;max-width:88%;text-align:center;box-shadow:0 4px 0 rgba(35,64,92,.12);min-height:24px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:6px solid transparent;border-top:12px solid #fff}
#charStage{width:min(64vw,250px);height:min(64vw,250px);margin-top:14px;position:relative;touch-action:manipulation}
#charStage svg{width:100%;height:100%;overflow:visible}
.char-shadow{width:55%;height:16px;background:rgba(35,64,92,.18);border-radius:50%;margin-top:-8px;filter:blur(2px)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bounceHappy{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-26px) scale(.96,1.05)}55%{transform:translateY(0) scale(1.06,.92)}75%{transform:translateY(-12px) scale(.98,1.02)}}
@keyframes wiggleSad{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes celebrateSpin{0%{transform:rotate(0) translateY(0)}30%{transform:rotate(-8deg) translateY(-20px)}60%{transform:rotate(8deg) translateY(-26px)}100%{transform:rotate(0) translateY(0)}}
@keyframes trickFlip{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes sleepBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(4px) rotate(2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(26px,-52px) scale(1.25)}}
@keyframes feverGlow{0%,100%{filter:drop-shadow(0 0 6px #ffd60a)}50%{filter:drop-shadow(0 0 20px #ff5d8f)}}
@keyframes petHeart{0%{opacity:0;transform:translateY(6px) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-44px) scale(1.15)}}
.anim-float{animation:floaty 3.2s ease-in-out infinite}
.anim-happy{animation:bounceHappy .7s ease}
.anim-sad{animation:wiggleSad .5s ease}
.anim-celebrate{animation:celebrateSpin .8s ease}
.anim-trick{animation:trickFlip .8s ease}
.anim-sleep{animation:sleepBob 3.4s ease-in-out infinite}
.anim-fever{animation:feverGlow .8s ease-in-out infinite}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4.6s infinite}
.zzz{font-size:22px;fill:#5b84ae;font-weight:900;opacity:0;animation:zzz 2.8s ease-out infinite}
.pet-heart{position:absolute;font-size:26px;pointer-events:none;animation:petHeart 1s ease-out forwards}
.menugrid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.bigbtn{border-radius:var(--radius);padding:16px 10px 13px;font-size:19px;font-weight:900;color:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .08s}
.bigbtn:active{transform:scale(.96)}
.bigbtn .emoji{font-size:34px;line-height:1}
.bigbtn .small{font-size:12px;font-weight:700;opacity:.92}
.b-map{background:linear-gradient(180deg,#38b6ff,#1d86e8)}
.b-chibi{background:linear-gradient(180deg,#ffb340,#ff8a1c)}
.b-versus{background:linear-gradient(180deg,#ff7ba9,#f43f7f)}
.b-coll{background:linear-gradient(180deg,#b388ff,#7c4dff)}
.b-parent{background:linear-gradient(180deg,#9db2c8,#71879e);grid-column:span 2;padding:11px;font-size:15px;flex-direction:row;justify-content:center}
.b-voice{background:linear-gradient(180deg,#ff8fb2,#e0356b);grid-column:span 2;text-decoration:none}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 4px 0 rgba(35,64,92,.12);padding:14px 16px;position:relative;z-index:2}
.mission-card{margin-top:14px}
.mission-card h3{font-size:15px;margin-bottom:8px}
.mission{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;font-weight:700}
.mission .mbar{flex:1;height:12px;background:#e7f0f7;border-radius:99px;overflow:hidden}
.mission .mbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd60a,#ff9f1c);border-radius:99px;transition:width .4s}
.mission.done{color:#1d9e8f}
.backbtn{align-self:flex-start;background:#fff;border-radius:999px;padding:9px 16px;font-weight:900;box-shadow:0 3px 0 rgba(35,64,92,.15);font-size:15px;margin-bottom:10px}
.screen-title{font-size:24px;font-weight:900;text-align:center;margin:2px 0 12px;color:#fff;text-shadow:0 2px 0 #2b7cd3}
.islands{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative;z-index:2}
.island{border-radius:22px;padding:14px 4px 10px;text-align:center;font-weight:900;box-shadow:var(--shadow);background:linear-gradient(180deg,#fff,#e8f7ff);position:relative;transition:transform .08s}
.island:active{transform:scale(.95)}
.island .num{font-size:34px;line-height:1.05}
.island .dan{font-size:13px;color:#5b84ae}
.island .stars{font-size:15px;letter-spacing:1px;min-height:20px}
.island.locked{filter:grayscale(.8);opacity:.55}
.island.boss{background:linear-gradient(180deg,#ffe29a,#ffb340)}
.island.cave{background:linear-gradient(180deg,#cdb4ff,#8e6bd8);color:#fff}
.island.cave .dan{color:#e7dcff}
.island .masteryline{height:8px;background:#e7f0f7;border-radius:99px;margin:7px 8px 2px;overflow:hidden}
.island .masteryline i{display:block;height:100%;background:var(--good)}
#view-quiz{padding:8px 10px 10px}
.quizhead{display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.qprogress{flex:1;height:14px;background:rgba(255,255,255,.65);border-radius:99px;overflow:hidden}
.qprogress i{display:block;height:100%;background:linear-gradient(90deg,#2ec4b6,#38b6ff);transition:width .35s}
.combo{font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(35,64,92,.3);min-width:86px;text-align:right}
.combo.hot{color:#ffe45e;animation:bounceHappy .5s ease}
.timerbar{height:10px;background:rgba(255,255,255,.55);border-radius:99px;overflow:hidden;margin-top:8px;position:relative;z-index:2}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5d8f,#ff9f1c);width:100%}
.timerbar.off{display:none}
.qcard{background:#fff;border-radius:22px;box-shadow:0 6px 0 rgba(35,64,92,.15);padding:10px 12px 8px;margin-top:7px;position:relative;z-index:2;text-align:center;display:flex;flex-direction:column}
.qwho{font-size:14px;font-weight:800;color:#5b84ae;min-height:18px}
.qtext{font-size:clamp(36px,11.5vw,50px);font-weight:900;letter-spacing:.03em;margin:2px 0 0;line-height:1.15}
.qtext .blank{color:var(--accent2)}
.qread{font-size:15px;font-weight:700;color:#8aa5bd;min-height:20px}
.qdots{display:flex;flex-direction:column;gap:4px;align-items:center;margin:6px 0 2px}
.plates{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:330px}
.plate{display:grid;gap:1px;background:#fff8e1;border:2px solid #ffd54f;border-radius:12px;padding:4px 5px;align-items:center;justify-items:center}
.treat{font-size:15px;line-height:1.15}
.visual-caption{font-size:13px;font-weight:900;color:#8a6d1a;background:#fffde7;border-radius:99px;padding:3px 10px;margin-top:2px}
.qhint{align-self:center;background:#fff3b0;border-radius:99px;padding:5px 13px;font-weight:900;font-size:13.5px;box-shadow:0 2px 0 rgba(35,64,92,.15);margin-top:2px}
.qanswer{min-height:44px;font-size:35px;font-weight:900;color:#1d86e8;letter-spacing:.06em;line-height:1.2}
.qanswer .placeholder{color:#c3d5e4}
.qfeedback{min-height:24px;font-size:16.5px;font-weight:900}
.qfeedback.good{color:#1d9e8f}.qfeedback.bad{color:var(--bad)}
.qmini{display:flex;align-items:flex-end;gap:8px;justify-content:center;margin-top:2px}
#quizChar{width:54px;height:54px;flex:none}
#quizChar svg{width:100%;height:100%;overflow:visible}
.bubble-s{background:#f2f9ff;border-radius:14px;padding:7px 12px;font-size:14px;font-weight:800;max-width:70%;min-height:20px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;position:relative;z-index:2}
.key{border-radius:14px;background:#fff;font-size:24px;font-weight:900;padding:8px 0;box-shadow:0 4px 0 rgba(35,64,92,.18)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(35,64,92,.18)}
.key.ok{background:linear-gradient(180deg,#2ec4b6,#17a398);color:#fff}
.key.del{background:#ffe3ec;color:#d6336c;font-size:21px}
.key.voice{background:linear-gradient(180deg,#b388ff,#7c4dff);color:#fff;font-size:21px}
.key.voice.listening{background:linear-gradient(180deg,#ff5d8f,#e0356b);animation:feverGlow .7s infinite}
.key:disabled{opacity:.45}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;position:relative;z-index:2}
.choice{border-radius:16px;background:#fff;font-size:29px;font-weight:900;padding:10px 0;box-shadow:0 5px 0 rgba(35,64,92,.18)}
.choice:active{transform:scale(.95)}
.result-stars{font-size:52px;text-align:center;letter-spacing:6px;min-height:64px}
.result-stars .off{opacity:.22;filter:grayscale(1)}
.result-msg{text-align:center;font-size:21px;font-weight:900;margin:4px 0 8px}
.result-stats{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.stat{background:#f2f9ff;border-radius:14px;padding:8px 13px;font-weight:800;font-size:14px;text-align:center}
.stat b{display:block;font-size:19px}
.teaser{text-align:center;font-size:14px;font-weight:700;color:#5b84ae;margin-top:10px}
.modal-wrap{position:fixed;inset:0;background:rgba(24,49,74,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-wrap.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:sheetUp .28s ease}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet h2{font-size:21px;font-weight:900;text-align:center;margin-bottom:6px}
.sheet .center{text-align:center}
.modebtn{display:flex;align-items:center;gap:12px;width:100%;background:#f2f9ff;border-radius:18px;padding:14px 16px;margin-top:10px;font-weight:900;font-size:17px;text-align:left;box-shadow:0 3px 0 rgba(35,64,92,.1)}
.modebtn .emoji{font-size:27px}
.modebtn .small{display:block;font-size:12px;font-weight:700;color:#5b84ae}
.modebtn.goldb{background:#fff3b0}
.chant-head{position:sticky;top:-20px;background:#fff;z-index:3;padding-top:2px;padding-bottom:6px}
.chant-example{background:#fffde7;border:2px solid #ffe082;border-radius:14px;padding:7px 6px 5px;margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.chant-list{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.chant-row{display:flex;align-items:center;gap:10px;background:#f2f9ff;border-radius:14px;padding:8px 12px;font-weight:900;font-size:18px;text-align:left;width:100%}
.chant-row.playing{background:#ffe9a8;outline:3px solid var(--gold)}
.chant-row .rd{margin-left:auto;font-size:13px;color:#5b84ae;font-weight:700}
.chant-row .mini-dots{display:flex;gap:2px}
.chant-row .mini-dots i{width:7px;height:7px;border-radius:50%;background:#ffd60a;border:1px solid #e0a800}
.profile-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.profile-item{display:flex;align-items:center;gap:12px;background:#f2f9ff;border-radius:16px;padding:12px 14px;font-weight:900;font-size:17px;width:100%;text-align:left}
.profile-item .avatar{font-size:30px}
.profile-item .del{margin-left:auto;background:#ffe3ec;color:#d6336c;border-radius:10px;padding:6px 11px;font-size:13px;font-weight:900}
.textinput{width:100%;border:3px solid #cfe6f5;border-radius:14px;padding:12px 14px;font-size:18px;font-weight:800;margin-top:10px;outline:none}
.textinput:focus{border-color:#38b6ff}
.primary-btn{display:block;width:100%;margin-top:14px;background:linear-gradient(180deg,#38b6ff,#1d86e8);color:#fff;font-size:18px;font-weight:900;border-radius:16px;padding:14px;box-shadow:0 4px 0 rgba(35,64,92,.2)}
.ghost-btn{display:block;width:100%;margin-top:9px;background:#eef4f9;color:#5b84ae;font-size:15px;font-weight:900;border-radius:16px;padding:12px}
.switchrow{display:flex;align-items:center;gap:10px;padding:11px 2px;font-weight:800;font-size:16px}
.switchrow .desc{font-size:12px;color:#5b84ae;font-weight:700}
.switch{margin-left:auto;width:58px;height:32px;border-radius:99px;background:#cfdde9;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch.on{background:var(--good)}.switch.on::after{left:29px}
.coll-tabs{display:flex;gap:8px;margin-bottom:12px;position:relative;z-index:2}
.coll-tab{flex:1;background:rgba(255,255,255,.75);border-radius:14px;padding:10px 2px;font-weight:900;font-size:14px}
.coll-tab.on{background:#fff;box-shadow:0 3px 0 rgba(35,64,92,.15)}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sticker{background:#fff;border-radius:16px;padding:10px 2px 7px;text-align:center;box-shadow:0 3px 0 rgba(35,64,92,.1)}
.sticker .em{font-size:31px}
.sticker .nm{font-size:10.5px;font-weight:800;margin-top:2px;line-height:1.25}
.sticker.locked .em{filter:grayscale(1);opacity:.3}
.sticker.locked .nm{color:#a9bfd2}
.item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.zukan-row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:13px;padding:8px 11px;margin-bottom:7px;font-weight:800;font-size:14px;box-shadow:0 2px 0 rgba(35,64,92,.08)}
.zukan-row .zb{flex:1;height:11px;background:#e7f0f7;border-radius:99px;overflow:hidden}
.zukan-row .zb i{display:block;height:100%;background:var(--good)}
.cert{background:#fffdf4;border:5px double #c9a227;border-radius:14px;padding:26px 18px;text-align:center;position:relative;z-index:2;box-shadow:0 8px 24px rgba(35,64,92,.2)}
.cert h2{font-size:27px;font-weight:900;color:#8a6d1a;letter-spacing:.14em}
.cert .cname{font-size:31px;font-weight:900;margin:16px 0 4px;border-bottom:3px solid #e8d48b;display:inline-block;padding:0 22px 5px}
.cert p{font-size:15px;line-height:1.9;font-weight:700}
.cert .seal{font-size:52px;margin-top:8px}
.feedback-pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:60}
.feedback-pop.show{display:flex}
.feedback-pop .pop{font-size:110px;animation:popIn .55s ease}
@keyframes popIn{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
.confetti{position:fixed;top:-4vh;font-size:22px;z-index:59;pointer-events:none;animation:confFall linear forwards}
@keyframes confFall{to{transform:translateY(112vh) rotate(560deg)}}
.treasure-emoji{font-size:96px;text-align:center;animation:bounceHappy .8s ease infinite}
.egg-stage{font-size:110px;text-align:center;padding:8px 0;animation:floaty 2.4s ease-in-out infinite;cursor:pointer}
.gate-q{font-size:30px;font-weight:900;text-align:center;margin:10px 0}
.notice{font-size:12.5px;color:#5b84ae;font-weight:700;line-height:1.6;margin-top:10px}
.versus-turn{text-align:center;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(35,64,92,.3);margin-top:2px;min-height:0;position:relative;z-index:2}.versus-turn:empty{display:none}
@media print{
  body{background:#fff}
  body.printing-cert .view{display:none!important}
  body.printing-cert #view-cert{display:block!important}
  body.printing-cert .noprint{display:none!important}
  .clouds{display:none}
}
</style>
</head>
<body>
<div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div></div>

<!-- ===== ホーム ===== -->
<section class="view active" id="view-home">
  <div class="topbar">
    <button class="chip" id="profileChip">👦 <span id="profileName">ゲスト</span></button>
    <span class="chip gold" id="levelChip">Lv.1</span>
    <span class="chip" id="streakChip">🔥 0にち</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnSettings" aria-label="せってい">⚙️</button>
  </div>
  <h1 class="title">九九アドベンチャー<span class="sub">ククと いっしょに 九九マスターを めざそう！</span></h1>
  <div class="charzone">
    <div class="bubble" id="homeBubble">タップして あそぼう！</div>
    <div id="charStage" class="anim-float"></div>
    <div class="char-shadow"></div>
  </div>
  <div class="menugrid">
    <button class="bigbtn b-map" id="btnMap"><span class="emoji">🗺️</span>ぼうけんマップ<span class="small">だんごとに すすもう</span></button>

<script>
/* ================= 状態管理 ================= */
const LS_KEY = "kukuAdventure.v1";
let DB = null;
function newProfile(name){
  return { id:"p"+Date.now().toString(36), name:name, xp:0, level:1,
    mastery:{}, stars:{}, stickers:[], items:[], wearing:null,
    streak:0, lastPlay:"", restTickets:1, missions:null, totalCorrect:0, totalAnswer:0,
    petCount:0, hatched:false, settings:{timer:false, tts:true} };
}
function loadDB(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ DB = JSON.parse(raw); } }catch(e){}
  if(!DB || !Array.isArray(DB.profiles)){ DB = { profiles:[], currentId:null }; }
  if(!DB.profiles.length){ const p = newProfile("ゲスト"); DB.profiles.push(p); DB.currentId = p.id; }
  if(!DB.profiles.find(p=>p.id===DB.currentId)) DB.currentId = DB.profiles[0].id;
}
function saveDB(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){} }
function P(){ return DB.profiles.find(p=>p.id===DB.currentId); }
function factKey(a,b){ return a+"x"+b; }
function getFact(p,a,b){ return p.mastery[factKey(a,b)] || {box:0,ok:0,ng:0,last:0}; }
function isMastered(p,a,b){ return getFact(p,a,b).box >= 4; }
function masteredCount(p){ let n=0; for(let a=1;a<=9;a++) for(let b=1;b<=9;b++) if(isMastered(p,a,b)) n++; return n; }
function danMastery(p,dan){ let s=0; for(let b=1;b<=9;b++) s += Math.min(getFact(p,dan,b).box,5)/5; return s/9; }
function levelStage(level){ return level>=12 ? 3 : (level>=5 ? 2 : 1); }
function xpForNext(level){ return level*80; }
function addXP(p, amount){
  p.xp += amount; let leveled=false;
  while(p.xp >= xpForNext(p.level)){ p.xp -= xpForNext(p.level); p.level++; leveled=true; }
  return leveled;
}
function giveSticker(p,id){ if(!p.stickers.includes(id)){ p.stickers.push(id); return true; } return false; }
function giveItem(p,id){ if(!p.items.includes(id)){ p.items.push(id); return true; } return false; }
function touchStreak(p){
  const t = todayStr();
  if(p.lastPlay === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const ys = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  if(p.lastPlay === ys){ p.streak += 1; }
  else if(p.lastPlay === ""){ p.streak = 1; }
  else {
    /* 1日だけの休みは「おやすみ券」で守る */
    const y2 = new Date(); y2.setDate(y2.getDate()-2);
    const y2s = y2.getFullYear()+"-"+(y2.getMonth()+1)+"-"+y2.getDate();
    if(p.lastPlay === y2s && p.restTickets > 0){ p.restTickets--; p.streak += 1; toast("🎟️ おやすみけんで れんぞく きろくを まもったよ！"); }
    else p.streak = 1;
  }
  p.lastPlay = t;
  if(p.streak >= 7) giveSticker(p,"streak7"), giveItem(p,"scarf");
  if(p.restTickets < 1 && p.streak % 5 === 0) p.restTickets = 1;
}
function ensureMissions(p){
  const t = todayStr();
  if(!p.missions || p.missions.date !== t){
    const seed = t.split("-").reduce((s,x)=>s+ +x,0);
    const pool = MISSION_POOL.slice();
    const picked = [];
    for(let i=0;i<3;i++){ picked.push(pool[(seed+i*2) % pool.length]); pool.splice((seed+i*2)%pool.length,1); }
    p.missions = { date:t, list:picked.map(m=>({id:m.id, prog:0, done:false})) };
  }
  return p.missions;
}
function missionProgress(p, type, n){
  const ms = ensureMissions(p); let changed=false;
  ms.list.forEach(m=>{
    const def = MISSION_POOL.find(x=>x.id===m.id);
    if(def && def.type===type && !m.done){ m.prog=Math.min(def.goal, m.prog+n); if(m.prog>=def.goal){ m.done=true; } changed=true; }
  });
  if(changed) saveDB();
}

<script>
/* ================= 音声（読み上げ・効果音・こえで こたえる） ================= */
let AC = null;
function audioCtx(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==="suspended") AC.resume(); return AC; }
function beep(freq, t0, dur, type, vol){
  const ac = audioCtx(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||"sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, ac.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol||0.16, ac.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+t0+dur);
  o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+dur+0.05);
}
function sfx(name){
  if(name==="good"){ beep(660,0,.12,"sine",.18); beep(880,.09,.2,"sine",.18); }
  if(name==="great"){ [523,659,784,1046].forEach((f,i)=>beep(f,i*.08,.22,"triangle",.18)); }
  if(name==="bad"){ beep(220,0,.18,"square",.07); beep(185,.1,.24,"square",.07); }
  if(name==="pop"){ beep(520,0,.07,"sine",.12); }
  if(name==="fever"){ [392,523,659,784,1046,1318].forEach((f,i)=>beep(f,i*.06,.2,"sawtooth",.07)); }
  if(name==="treasure"){ [784,988,1175,1568].forEach((f,i)=>beep(f,i*.1,.3,"triangle",.16)); }
  if(name==="levelup"){ [523,659,784,1046,784,1046,1318].forEach((f,i)=>beep(f,i*.09,.26,"triangle",.17)); }
}
let jaVoice = null;
function normLang(l){ return (l||"").replace(/_/g,"-"); }
function pickVoice(){
  try{
    const all = speechSynthesis.getVoices();
    const vs = all.filter(v=>/^ja([-]|$)/i.test(normLang(v.lang)) || /Japanese|日本/.test(v.name));
    jaVoice = vs.find(v=>/Google/.test(v.name)) || vs.find(v=>/Natural|Online|Premium|Enhanced/i.test(v.name)) || vs.find(v=>/Kyoko|Otoya/i.test(v.name)) || vs[0] || null;
  }catch(e){}
}
let voicesWaiter = null;
function ensureVoices(){
  if(!("speechSynthesis" in window)) return Promise.resolve(false);
  pickVoice();
  if(jaVoice || speechSynthesis.getVoices().length) return Promise.resolve(!!jaVoice);
  if(voicesWaiter) return voicesWaiter;
  voicesWaiter = new Promise(res=>{
    let done = false;
    const finish = ()=>{ if(done) return; done = true; pickVoice(); voicesWaiter = null; res(!!jaVoice); };
    try{ speechSynthesis.onvoiceschanged = ()=>{ pickVoice(); if(jaVoice) finish(); }; }catch(e){}
    let n = 0; const iv = setInterval(()=>{ pickVoice(); n++; if(jaVoice || n>=8){ clearInterval(iv); finish(); } }, 150);
    setTimeout(()=>{ clearInterval(iv); finish(); }, 1400);
  });
  return voicesWaiter;
}
if("speechSynthesis" in window){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text, opts){
  const p = P(); if(p && p.settings && p.settings.tts===false) return Promise.resolve(false);
  if(!("speechSynthesis" in window)) return Promise.resolve(false);
  return ensureVoices().then(()=> new Promise(res=>{
    let settled = false; const done = ok=>{ if(!settled){ settled = true; res(ok); } };
    try{
      const wasBusy = speechSynthesis.speaking || speechSynthesis.pending;
      if(wasBusy) speechSynthesis.cancel();
      const start = ()=>{
        try{
          if(speechSynthesis.paused) speechSynthesis.resume();
          const u = new SpeechSynthesisUtterance(text);
          if(jaVoice){ u.voice = jaVoice; u.voiceURI = jaVoice.voiceURI; u.lang = normLang(jaVoice.lang) || "ja-JP"; }
          else u.lang = "ja-JP";
          u.rate = (opts&&opts.rate) || 0.95; u.pitch = (opts&&opts.pitch) || 1.0; u.volume = 1;
          u.onend = ()=>done(true); u.onerror = ()=>done(false);
          speechSynthesis.speak(u);
          if(speechSynthesis.paused) speechSynthesis.resume();
          setTimeout(()=>done(speechSynthesis.speaking===false), 2200 + text.length*260);
        }catch(e){ done(false); }
      };
      if(wasBusy) setTimeout(start, 90); else start();
    }catch(e){ done(false); }
  }));
}
function stopSpeak(){ chantToken++; try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }
async function speakTest(){

const KANA_NUM = {"ぜろ":0,"れい":0,"いち":1,"に":2,"さん":3,"よん":4,"し":4,"ご":5,"ろく":6,"なな":7,"しち":7,"はち":8,"きゅう":9,"く":9};
function parseJapaneseNumbers(text){
  if(!text) return [];
  const t = text.replace(/\s/g,"").replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const out = []; const digitRe = /\d+/g; let m;
  const kanaTokens = [];
  let i = 0;
  while(i < t.length){
    if(/\d/.test(t[i])){ i++; continue; }
    let matched = null;
    for(const k of Object.keys(KANA_NUM).concat(["じゅう"])){ if(t.startsWith(k,i)){ matched = k; break; } }
    if(matched){ kanaTokens.push({k:matched, at:i}); i += matched.length; }
    else i++;
  }
  while((m = digitRe.exec(t)) !== null){ out.push({v:parseInt(m[0],10), at:m.index}); }
  let cur = null;
  kanaTokens.forEach(tok=>{
    if(tok.k === "じゅう"){ cur = (cur===null?1:cur) * 10; out.push({v:cur, at:tok.at, kana:true, partial:true}); }
    else if(cur !== null && cur % 10 === 0){ cur = cur + KANA_NUM[tok.k]; out.push({v:cur, at:tok.at, kana:true}); cur = null; }
    else { out.push({v:KANA_NUM[tok.k], at:tok.at, kana:true}); cur = null; }
  });
  out.sort((x,y)=>x.at-y.at);
  return out;
}
let recog = null, recogActive = false;
function voiceAvailable(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function startVoiceInput(onResult, onFail){
  if(!voiceAvailable()){ onFail && onFail(); return; }
  try{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recog = new SR(); recog.lang = "ja-JP"; recog.interimResults = false; recog.maxAlternatives = 3;
    recogActive = true;
    recog.onresult = e => {
      recogActive = false;
      const texts = Array.from(e.results[0]).map(a=>a.transcript);
      for(const t of texts){ const nums = parseJapaneseNumbers(t); if(nums.length){ onResult(nums[nums.length-1].v, t); return; } }
      onFail && onFail();
    };
    recog.onerror = ()=>{ recogActive = false; onFail && onFail(); };
    recog.onend = ()=>{ recogActive = false; };
    recog.start();
  }catch(e){ recogActive = false; onFail && onFail(); }
}

<script>
/* ================= クイズエンジン ================= */
let S = null;
const TREATS = [
  null,
  {em:"🍬", nm:"あめ"}, {em:"🍪", nm:"クッキー"}, {em:"🍓", nm:"いちご"},
  {em:"🍊", nm:"みかん"}, {em:"🍎", nm:"りんご"}, {em:"🍇", nm:"ぶどう"},
  {em:"🍩", nm:"ドーナツ"}, {em:"🧁", nm:"ケーキ"}, {em:"🍮", nm:"プリン"}
];
function treatFor(a){ return TREATS[Math.max(1, Math.min(9, a))] || TREATS[1]; }
function visualHTML(a,b){
  const tr = treatFor(a);
  const cols = a<=2 ? a : a<=6 ? 3 : 3;
  let plates = "";
  for(let g=0; g<b; g++){
    let items = "";
    for(let j=0;j<a;j++) items += `<span class="treat">${tr.em}</span>`;
    plates += `<div class="plate" style="grid-template-columns:repeat(${cols},1fr)">${items}</div>`;
  }
  const add = Array.from({length:b}, ()=>a).join("＋");
  return `<div class="plates">${plates}</div><div class="visual-caption">${tr.nm}が ${a}こずつ ${b}さら： ${add} を かぞえてみよう</div>`;
}
function dotsHTML(a,b,dim){ return visualHTML(a,b); }
function dueFacts(p, dan){
  const now = Date.now();
  return [1,2,3,4,5,6,7,8,9].filter(b=>{
    const f = getFact(p, dan, b);
    return f.box < 5 && (f.last === 0 || now - f.last > INTERVALS[f.box]);
  });
}
function buildPracticeQueue(p, dan){
  const due = dueFacts(p, dan);
  const all = [1,2,3,4,5,6,7,8,9];
  const focus = (due.length ? due : all.slice()).sort((x,y)=>getFact(p,dan,x).box - getFact(p,dan,y).box || x-y);
  const picks = focus.slice(0,6);
  const rest = shuffle(all.filter(b=>!picks.includes(b))).slice(0,4);
  let q = shuffle(picks.concat(rest)).map(b=>({a:dan, b:b, type:"normal"}));
  while(q.length < 10){ const b = picks[Math.floor(Math.random()*picks.length)]; q.push({a:dan, b:b, type:"normal"}); }
  const warm = q.reduce((mi,qx,i)=> qx.b < q[mi].b ? i : mi, 0);
  q.unshift(q.splice(warm,1)[0]);
  return q;
}
function buildTestQueue(dan){
  const bs = shuffle([1,2,3,4,5,6,7,8,9]).concat([1+Math.floor(Math.random()*9)]);
  return bs.map((b,i)=>({a:dan, b:b, type:(i===4||i===8)?"mushikui":"normal"}));
}
function buildMixedQueue(n, hard){

}
function startSession(opts){

        combo:0, bestCombo:0, fever:0, input:"", locked:false, catHere:false, catScore:0,
        players:opts.players||null, turn:0, scores:{}, timerOn: !!opts.timerOn, timerId:null, timeLeft:0,
        chibi:!!opts.chibi, xpEarned:0, voiceOk:0, mistakes:[], onDone:opts.onDone||null };

function currentPlayer(){

}
function nextQuestion(){

  const q = S.queue[S.idx];

  $("#qWho").textContent = S.mode==="boss" ? "👑 九九マスターへの しれん" : S.mode==="cave" ? "💎 ひみつの どうくつ" : S.dan ? `${S.dan} の段` : S.chibi ? "🐣 ちびっこモード" : "";
  const qc = $("#quizChar");

function renderQuestion(q){

function updateFact(p, a, b, ok){

function judge(val, timedOut){

  else if(k === "ok"){ if(S.input !== "") judge(parseInt(S.input,10), false); return; }
  else if(k){ if(S.input.length < 2) S.input += k; }
  else return;
  sfx("pop");
  $("#qAnswer").textContent = S.input === "" ? "？" : S.input;
  if(S.input === "") $("#qAnswer").innerHTML = '<span class="placeholder">？</span>';
});
$("#qHintBtn").addEventListener("click", ()=>{
  if(!S || S.locked) return; const q = S.queue[S.idx]; if(!q) return;
  const dots = $("#qDots");
  if(dots.innerHTML){ dots.innerHTML = ""; $("#qHintBtn").textContent = "💡 ヒント：おさらを みる"; }
  else { dots.innerHTML = visualHTML(q.a, q.b); $("#qHintBtn").textContent = "ヒントを かくす"; sfx("pop"); }
});
$("#btnVoice").addEventListener("click", ()=>{
  if(!S || S.locked) return;
  const btn = $("#btnVoice"); btn.classList.add("listening"); btn.textContent = "👂 ききとりちゅう";
  startVoiceInput(v=>{
    btn.classList.remove("listening"); btn.textContent = "🎤 こえ";
    S.voiceOk++; missionProgress(P(), "voice", 1);
    $("#qAnswer").textContent = v;
    setTimeout(()=>judge(v, false), 250);
  }, ()=>{
    btn.classList.remove("listening"); btn.textContent = "🎤 こえ";
    toast("うまく ききとれなかったよ。もういちどか、すうじを タップしてね");
  });
});
$("#quizChar").addEventListener("click", ()=>{
  if(!S) return; const q = S.queue[S.idx];
  if(q && q.type === "listen") speakFact(q.a, q.b, false);
  else if(q) speakFact(q.a, q.b, false);
});
$("#btnQuitQuiz").addEventListener("click", ()=>{ if(S){ clearInterval(S.timerId); S = null; } if("speechSynthesis" in window) speechSynthesis.cancel(); showView("view-home"); });
</script>

<script>
/* ================= 結果・ごほうび ================= */

    stars = s.mistakes.length === 0 ? 3 : s.mistakes.length <= 2 ? 2 : 1;

    if(stars > prev) p.stars[s.dan] = stars;

    if(stars === 3){ giveSticker(p, "star3"); giveItem(p, "ribbon"); }

  } else if(s.mode === "practice"){
    title = `${s.dan}の段 れんしゅう`; msg = `10もんちゅう ${s.correct}もん せいかい！ その ちょうし！`;
    giveSticker(p, "first"); giveItem(p, "hat"); missionProgress(p, "clear", 1);
  } else if(s.mode === "boss"){
    const pass = s.correct >= 18;
    title = "👑 ボスせん"; msg = pass ? "やったー！ 九九マスター にんてい！" : `あとすこし！（ごうかくは 20もんちゅう 18もん）`;
    if(pass){ giveSticker(p, "boss"); giveItem(p, "glasses"); stars = 3; }
  } else if(s.mode === "cave"){
    const pass = s.correct >= 12;
    title = "💎 ひみつの どうくつ"; msg = pass ? "どうくつの たからを てに いれた！" : "どうくつは てごわい…また ちょうせんしてね";
    if(pass){ giveSticker(p, "cave"); giveItem(p, "crown"); stars = 3; }
  } else if(s.mode === "chibi"){
    title = "🐣 ちびっこモード"; msg = "よく がんばったね！"; giveSticker(p, "chibi"); stars = s.correct>=5?3:2;
  } else if(s.mode === "versus"){
    title = "⚔️ たいけつの けっか";
    const [pa, pb] = s.players; const sa = s.scores[pa.id], sb = s.scores[pb.id];
    if(sa.ok !== sb.ok){ const w = sa.ok > sb.ok ? pa : pb; msg = `🏆 ${w.name} の かち！`; giveSticker(w, "versus"); }
    else msg = "ひきわけ！ どっちも すごい！";
    showVersusResult(s, msg);
    saveDB(); return;
  }
  const leveled = addXP(p, s.xpEarned);
  saveDB();
  $("#resultTitle").textContent = title;
  $("#resultStars").innerHTML = [1,2,3].map(i=>`<span class="${i<=stars?"":"off"}">⭐</span>`).join("");
  $("#resultMsg").textContent = msg;
  $("#resultChar").innerHTML = charSVG({stage:levelStage(p.level), mood: stars>=2?"celebrate":"happy", gold:homeState.goldDay, wearing:p.wearing});
  $("#resultStats").innerHTML =
    `<div class="stat">せいかい<b>${s.correct} / ${s.answered}もん</b></div>` +
    `<div class="stat">さいだいコンボ<b>${s.bestCombo}</b></div>` +
    `<div class="stat">XP<b>+${s.xpEarned}</b></div>` +
    `<div class="stat">おぼえた かず<b>${masteredCount(p)} / 81</b></div>`;
  $("#resultTeaser").textContent = "🔮 ククの よげん：" + shuffle(TEASERS)[0];
  $("#btnResultRetry").onclick = ()=>{ if(s.onDone) s.onDone(); else showView("view-map"); };
  $("#btnResultHome").textContent = s.mode==="boss" && s.correct>=18 ? "🎓 にんていしょうを みる" : "🗺️ マップへ もどる";
  $("#btnResultHome").onclick = ()=>{ if(s.mode==="boss" && s.correct>=18) renderCert(); else showView("view-map"); };
  showView("view-result");
  if(stars >= 2){ sfx("levelup"); confetti(22); } else sfx("great");
  if(leveled){ setTimeout(()=>{ toast(`🎉 レベルアップ！ Lv.${p.level} になったよ！`); sfx("levelup"); if(levelStage(p.level)!==levelStage(p.level-1)) setTimeout(()=>toast("🐲 ククが しんかしたよ！ ホームで みてみてね"), 1800); }, 700); }
  if(Math.random() < 0.35 && s.mode !== "versus") setTimeout(openTreasure, 1400);
}

/* ================= マップ・ステージ ================= */
function totalStars(p){ return Object.values(p.stars).reduce((a,b)=>a+b,0); }
function renderMap(){
  const p = P(); const g = $("#islandGrid"); g.innerHTML = "";

  }
  const boss = document.createElement("button"); boss.className = "island boss" + (totalStars(p) < 9 ? " locked" : "");

}

    <button class="modebtn" id="msPractice"><span class="emoji">✏️</span><span>れんしゅう（10もん）<span class="small">じゅんばん→バラバラ、にがては くりかえし でるよ</span></span></button>
    <button class="modebtn goldb" id="msTest" ${testLocked?"disabled style='opacity:.5'":""}><span class="emoji">⭐</span><span>テスト（10もん）<span class="small">${testLocked ? "まえの だんで ★を とると ひらくよ" : "★を あつめよう！ むしくいさんも でるよ"}</span></span></button>

  $("#msTest").onclick = ()=>{ if(testLocked) return; closeSheet(); const pp=P(); startSession({mode:"test", dan, queue:buildTestQueue(dan), timerOn:pp.settings.timer, onDone:()=>startSession({mode:"test", dan, queue:buildTestQueue(dan), timerOn:P().settings.timer}) }); };

    <button class="ghost-btn" onclick="closeSheet()">まだ やめておく</button>`);
  $("#bossGo").onclick = ()=>{ closeSheet(); const pp=P(); startSession({mode:"boss", queue:buildMixedQueue(20,true), timerOn:pp.settings.timer, onDone:()=>startSession({mode:"boss", queue:buildMixedQueue(20,true), timerOn:P().settings.timer}) }); };

/* ================= おぼえる（暗唱） ================= */
let chantToken = 0;
function openChant(dan){
  const rows = [1,2,3,4,5,6,7,8,9].map(b=>`<button class="chant-row" data-b="${b}"><span>${dan} × ${b} ＝ ${dan*b}</span><span class="rd">${READINGS[dan][b-1]}</span></button>`).join("");
  openSheet(`<div class="chant-head"><h2>🎵 ${dan} の段を おぼえよう</h2>
    <p class="center" style="font-weight:700;color:#5b84ae;font-size:13px">ぎょうをタップすると こえが でるよ。「ぜんぶ きく」で ククと いっしょに となえよう！</p>
    <button class="primary-btn" id="chantPlay">▶ ぜんぶ きく（1から 9）</button>
    <button class="primary-btn" id="chantReverse" style="background:linear-gradient(180deg,#ffb340,#ff8a1c)">🔁 さかさまに きく（9から 1）</button>
    <div style="display:flex;gap:8px"><button class="ghost-btn" id="chantStop" style="flex:1">⏹ とめる</button><button class="ghost-btn" id="chantTest" style="flex:1">🔊 こえの テスト</button></div>
    </div>
    <div class="chant-example"><div style="font-weight:900;font-size:13px;color:#8a6d1a;text-align:center">たとえば ${dan} の段は…</div>${visualHTML(dan,3)}</div>
    <div class="chant-list">${rows}</div>
    <button class="ghost-btn" onclick="stopSpeak(); closeSheet()">とじる</button>`);
  $$("#modalSheet .chant-row").forEach(r=>{
    r.onclick = ()=>{ chantToken++; $$("#modalSheet .chant-row").forEach(x=>x.classList.remove("playing")); r.classList.add("playing"); r.scrollIntoView({block:"center", behavior:"smooth"}); speakFact(dan, +r.dataset.b, true).then(()=>r.classList.remove("playing")); };
  });
  const playChant = async order=>{
    const my = ++chantToken;
    for(const b of order){
      if(my !== chantToken) return;
      const row = $$("#modalSheet .chant-row").find(x=>+x.dataset.b===b);
      $$("#modalSheet .chant-row").forEach(x=>x.classList.toggle("playing", +x.dataset.b===b));
      if(row) row.scrollIntoView({block:"center", behavior:"smooth"});
      await speakFact(dan, b, true);
      if(my !== chantToken) return;
      await new Promise(r=>setTimeout(r, 240));
    }
    $$("#modalSheet .chant-row").forEach(x=>x.classList.remove("playing"));
  };
  $("#chantPlay").onclick = ()=>playChant([1,2,3,4,5,6,7,8,9]);
  $("#chantReverse").onclick = ()=>playChant([9,8,7,6,5,4,3,2,1]);
  $("#chantStop").onclick = ()=>{ stopSpeak(); $$("#modalSheet .chant-row").forEach(x=>x.classList.remove("playing")); };
  $("#chantTest").onclick = ()=>{ chantToken++; speakTest(); };
}

<script>

function openVersusSetup(){

function openSettings(){

  openSheet(`<h2>⚙️ せってい</h2>
    <div class="switchrow"><span>⏱️ じかん せいげん<span class="desc" style="display:block">テストや たいけつで じかんを はかります</span></span><button class="switch ${p.settings.timer?"on":""}" id="swTimer"></button></div>
    <div class="switchrow"><span>🔊 ククの こえ（よみあげ）<span class="desc" style="display:block">もんだいや よみかたを こえで だします</span></span><button class="switch ${p.settings.tts!==false?"on":""}" id="swTts"></button></div>
    <button class="modebtn" id="setVoiceTest"><span class="emoji">🔊</span><span>こえの テスト<span class="small">「ににんが し」と きこえるか たしかめる</span></span></button>
    <div class="switchrow"><span>🎤 こえで こたえる<span class="desc" style="display:block">${voiceAvailable() ? "この たんまつでは つかえます。クイズちゅうの 🎤から こえで こたえられます" : "この たんまつ・ブラウザでは つかえません（すうじタップで あそべます）"}</span></span></div>
    <button class="modebtn" id="setProfiles"><span class="emoji">👦</span><span>プロフィールの きりかえ・ついか</span></button>
    <button class="modebtn" id="setReset" style="background:#ffe3ec"><span class="emoji">🗑️</span><span>${p.name} の きろくを リセット</span></button>
    <button class="ghost-btn" onclick="closeSheet()">とじる</button>
    <p class="notice">きろくは この たんまつの なかにだけ ほぞんされます（インターネットに おくられません）。<br>こえが でないときは、おとなに たんまつの「せってい」で Googleの にほんご よみあげの こえが はいっているか みてもらってね。</p>`);
  $("#swTimer").onclick = e=>{ p.settings.timer = !p.settings.timer; e.target.classList.toggle("on", p.settings.timer); saveDB(); };
  $("#swTts").onclick = e=>{ p.settings.tts = !(p.settings.tts!==false); e.target.classList.toggle("on", p.settings.tts); saveDB(); if(!p.settings.tts && "speechSynthesis" in window) speechSynthesis.cancel(); };
  $("#setVoiceTest").onclick = ()=>speakTest();
  $("#setProfiles").onclick = ()=>openProfiles(false);
  $("#setReset").onclick = ()=>{ if(confirm(`${p.name} の きろくを すべて けしますか？`)){ const np = newProfile(p.name); np.id = p.id; Object.assign(p, np); saveDB(); closeSheet(); renderHome(); toast("リセットしました"); } };
}
/* ================= おとな用 ================= */
function openParentGate(){
  const a = 6+Math.floor(Math.random()*8), b = 3+Math.floor(Math.random()*6);
  openSheet(`<h2>🔒 おとな確認</h2><p class="center" style="font-weight:700;color:#5b84ae">お子さまの誤操作防止のため、計算に お答えください</p>
    <div class="gate-q">${a} × ${b} ＝ ？</div>
    <input class="textinput" id="gateAns" type="number" inputmode="numeric" placeholder="答え">
    <button class="primary-btn" id="gateGo">確認する</button>
    <button class="ghost-btn" onclick="closeSheet()">とじる</button>`);
  $("#gateGo").onclick = ()=>{
    if(parseInt($("#gateAns").value,10) === a*b){ closeSheet(); renderParent(); showView("view-parent"); }
    else toast("答えが 違います");
  };
}
function renderParent(){
  const p = P();
  const rows = [1,2,3,4,5,6,7,8,9].map(dan=>{
    const cells = [1,2,3,4,5,6,7,8,9].map(b=>{ const f = getFact(p,dan,b); const c = f.box>=4 ? "#2ec4b6" : f.box>=2 ? "#ffd60a" : f.box>=1 ? "#ffb340" : "#e7f0f7"; return `<span title="${dan}×${b}" style="display:inline-block;width:15px;height:15px;border-radius:4px;background:${c};margin:1px"></span>`; }).join("");
    return `<div class="zukan-row"><b style="width:52px">${dan} の段</b><span style="flex:1">${cells}</span><span>${Math.round(danMastery(p,dan)*100)}%</span></div>`;
  }).join("");
  $("#parentBody").innerHTML = `<div class="card">
    <p style="font-weight:900;font-size:16px">${p.name} さん（Lv.${p.level}／⭐合計 ${totalStars(p)}）</p>
    <p style="font-weight:700;margin-top:6px;line-height:1.8">完全に覚えた九九： <b>${masteredCount(p)} / 81</b><br>通算： ${p.totalAnswer}問中 ${p.totalCorrect}問 正解／ 連続プレイ ${p.streak}日</p>
    <p class="notice">色の見方： 🟩=完璧に定着 🟨=ほぼ定着 🟧=学習中 ⬜=未着手。間違えた問題は、忘れた頃に自動で再出題される設計です（間隔反復）。</p>
    <div style="margin-top:10px">${rows}</div>
    ${masteredCount(p)>=81 ? `<button class="primary-btn" onclick="renderCert()">🎓 認定証を表示</button>` : ""}
    </div>`;
}
/* ================= コレクション ================= */
let collTab = "stickers";
function renderCollection(){
  const p = P(); const body = $("#collBody");
  $$(".coll-tab").forEach(t=>t.classList.toggle("on", t.dataset.tab===collTab));
  if(collTab === "stickers"){
    body.innerHTML = `<div class="sticker-grid">${STICKERS.map(st=>{
      const has = p.stickers.includes(st.id);
      return `<div class="sticker ${has?"":"locked"}"><div class="em">${has?st.em:"❓"}</div><div class="nm">${has?st.nm:st.how}</div></div>`;
    }).join("")}</div>`;
  } else if(collTab === "items"){
    body.innerHTML = `<div class="qmini" style="margin-bottom:12px"><div style="width:130px;height:130px">${charSVG({stage:levelStage(p.level), mood:"normal", gold:homeState.goldDay, wearing:p.wearing})}</div></div>
    <div class="item-grid">${ITEMS.map(it=>{
      const has = p.items.includes(it.id); const wearing = p.wearing===it.id;
      return `<button class="sticker ${has?"":"locked"}" data-item="${it.id}" ${has?"":"disabled"}><div class="em">${has?it.em:"❓"}</div><div class="nm">${has? it.nm + (wearing?"（つけている）":"") : it.how}</div></button>`;
    }).join("")}</div>
    <button class="ghost-btn" id="wearNone">きせかえを はずす</button>`;
    $$("#collBody [data-item]").forEach(b=>{ b.onclick = ()=>{ p.wearing = b.dataset.item; saveDB(); renderCollection(); sfx("pop"); }; });
    $("#wearNone").onclick = ()=>{ p.wearing = null; saveDB(); renderCollection(); };
  } else {
    body.innerHTML = [1,2,3,4,5,6,7,8,9].map(dan=>{
      const cells = [1,2,3,4,5,6,7,8,9].map(b=>{ const f=getFact(p,dan,b); const pct = Math.min(f.box,5)/5*100;
        return `<div class="zukan-row" style="flex:1 1 100%"><span style="width:76px">${dan}×${b}＝${dan*b}</span><span class="zb"><i style="width:${pct}%"></i></span><span style="font-size:12px;color:#5b84ae">${f.box>=4?"かんぺき！":f.box>=1?"おぼえちゅう":"まだ"}</span></div>`; }).join("");
      return `<p style="font-weight:900;color:#fff;text-shadow:0 1px 0 rgba(35,64,92,.4);margin:10px 0 6px">${dan} の段</p>${cells}`;
    }).join("");
  }
}
/* ================= ホーム ================= */
function renderHome(){
  const p = P(); touchStreak(p); ensureMissions(p); saveDB();
  $("#profileName").textContent = p.name;
  $("#levelChip").textContent = "Lv." + p.level + (homeState.goldDay ? " ✨きんククのひ" : "");
  $("#streakChip").textContent = "🔥 " + p.streak + "にち";
  renderHomeChar();
  const ms = ensureMissions(p);
  $("#missionList").innerHTML = ms.list.map(m=>{
    const def = MISSION_POOL.find(x=>x.id===m.id);
    return `<div class="mission ${m.done?"done":""}"><span>${m.done?"✅":"🎯"}</span><span style="flex:none">${def.nm}</span><span class="mbar"><i style="width:${Math.min(100, m.prog/def.goal*100)}%"></i></span><span>${m.prog}/${def.goal}</span></div>`;
  }).join("") + (ms.list.every(m=>m.done) ? `<p style="font-weight:900;color:#1d9e8f;margin-top:6px">🎉 きょうのミッション ぜんぶクリア！</p>` : "");
  resetIdle();
}
$("#charStage").addEventListener("click", e=>{
  audioCtx(); resetIdle();
  const p = P();
  const heart = document.createElement("span"); heart.className="pet-heart"; heart.textContent = "💗";
  heart.style.left = (30+Math.random()*40)+"%"; heart.style.top = "30%";
  $("#charStage").appendChild(heart); setTimeout(()=>heart.remove(), 1000);
  homeState.petRun++;
  clearTimeout(homeState.petTimer); homeState.petTimer = setTimeout(()=>{ homeState.petRun = 0; }, 1600);
  if(homeState.petRun >= 10){
    homeState.petRun = 0; charReact("trick"); sfx("fever");
    setBubble("🌀 ククの ひみつげい！ くるりんぱ！");
    if(giveSticker(p, "pet")){ saveDB(); toast("🏅 ひみつシール「なかよし」を ゲット！"); }
    speak("ひみつの わざ！", {rate:1});
  } else {
    charReact("happy"); sfx("pop");
    setBubble(shuffle(["なでなで ありがとう！","きょうも いっしょに がんばろう！","ククは げんき いっぱい！","九九、もう おぼえた？","タップ きもちいい〜"])[0]);
  }
});
/* ================= 画面遷移・初期化 ================= */
$$("[data-go]").forEach(b=>b.addEventListener("click", ()=>showView(b.dataset.go)));
$("#profileChip").addEventListener("click", ()=>openProfiles(false));
$("#btnSettings").addEventListener("click", openSettings);
$("#btnMap").addEventListener("click", ()=>{ renderMap(); showView("view-map"); });
$("#btnChibi").addEventListener("click", startChibi);
$("#btnVersus").addEventListener("click", openVersusSetup);
$("#btnColl").addEventListener("click", ()=>{ renderCollection(); showView("view-collection"); });
$("#btnParent").addEventListener("click", openParentGate);
$$(".coll-tab").forEach(t=>t.addEventListener("click", ()=>{ collTab = t.dataset.tab; renderCollection(); }));
document.addEventListener("pointerdown", ()=>{ audioCtx(); }, {once:true});
loadDB();
(function boot(){
  const p = P();
  homeState.goldDay = Math.random() < 0.12;
  renderHome();
  if(!p.hatched){
    setBubble("🥚 たまごが とどいてるよ…プロフィールから みてみてね");
    openEgg(p);
  } else if(homeState.goldDay){
    if(giveSticker(p, "gold")) saveDB();
    setBubble("✨ わあ！ きょうのククは きんいろだ！ ラッキーデー！");
    setTimeout(()=>toast("✨ きんのククに あえた！ シールを ゲット（コレクションで かくにん）"), 600);
  } else {
    setBubble(shuffle(["おはよう！ きょうも あそぼう！","ククと 九九の ぼうけんに しゅっぱつ！","あたらしい しま、ひらいてない？ みてみよう","九九マスターへの みちは 1もんから！"])[0]);
  }
})();
</script>
</body>
</html>
